name: Prebuild and publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  prebuild:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: ubuntu-latest
            arch: x64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev

      - name: Install dependencies
        run: npm ci

      - name: Build prebuilds
        run: npm run build:prebuild

      - name: Upload prebuild artifact
        uses: actions/upload-artifact@v7
        with:
          name: prebuilds-${{ matrix.os }}-${{ matrix.arch }}
          path: prebuilds/

  merge-prebuilds:
    needs: prebuild
    runs-on: ubuntu-latest
    steps:
      - name: Download all prebuild artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Merge into prebuilds/
        run: |
          mkdir -p prebuilds
          echo "Downloaded artifacts:"
          find artifacts -name '*.node' -print

          # download-artifact@v8 + merge-multiple → artifacts/<triple>/vlc_binding.node
          while IFS= read -r node; do
            triple="$(basename "$(dirname "$node")")"
            mkdir -p "prebuilds/$triple"
            cp "$node" "prebuilds/$triple/"
          done < <(find artifacts -name '*.node' -type f)

          # Legacy layout: artifacts/prebuilds-<runner>-<arch>/<triple>/
          for dir in artifacts/prebuilds-*/; do
            [ -d "$dir" ] || continue
            cp -r "$dir"/* prebuilds/
          done

          echo "Merged prebuilds:"
          find prebuilds -name '*.node' -print
          test "$(find prebuilds -name '*.node' | wc -l)" -ge 1

      - name: Upload merged prebuilds
        uses: actions/upload-artifact@v7
        with:
          name: prebuilds-merged
          path: prebuilds/

  publish-release:
    needs: merge-prebuilds
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download merged prebuilds
        uses: actions/download-artifact@v8
        with:
          name: prebuilds-merged
          path: prebuilds

      - name: Create release archive
        run: tar -czvf evp-prebuilds.tar.gz prebuilds

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: evp-prebuilds.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    needs: merge-prebuilds
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Download merged prebuilds
        uses: actions/download-artifact@v8
        with:
          name: prebuilds-merged
          path: prebuilds

      - name: Verify prebuilds
        run: find prebuilds -name '*.node' -print

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
